<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>G3 三锥合一柱拼合器</title>
<style>
  body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #info {
    position: absolute; top: 20px; left: 20px;
    color: white; background: rgba(0,0,0,0.75);
    padding: 15px 20px; border-radius: 8px;
    font-size: 15px; line-height: 1.9;
  }
  #info strong { color: #66ccff; font-size: 17px; }
  .v1 { color: #ff6666; font-weight: bold; }
  .v2 { color: #66ff88; font-weight: bold; }
  .v3 { color: #ffcc44; font-weight: bold; }
  .big { color: #66ccff; font-size: 18px; font-weight: bold; }
  #controls {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 18px 28px; border-radius: 10px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; min-width: 520px;
  }
  #sliderRow { display: flex; align-items: center; gap: 15px; width: 100%; }
  #sliderRow label { color: white; font-size: 16px; white-space: nowrap; }
  input[type=range] { flex: 1; height: 8px; cursor: pointer; }
  #tValue { color: #ffcc00; font-weight: bold; font-size: 20px; min-width: 60px; text-align: right; }
  #btnRow { display: flex; gap: 12px; }
  button {
    padding: 9px 20px; font-size: 15px;
    border: none; border-radius: 6px;
    cursor: pointer; background: #4488ff;
    color: white; font-weight: bold;
  }
  button:hover { background: #3366cc; }
  #hint {
    position: absolute; top: 20px; right: 20px;
    color: #aaccff; background: rgba(0,0,0,0.7);
    padding: 12px 18px; border-radius: 8px;
    font-size: 14px; line-height: 1.7; max-width: 260px;
  }
  #legend {
    position: absolute; bottom: 200px; right: 20px;
    background: rgba(0,0,0,0.7);
    padding: 12px 18px; border-radius: 8px;
    font-size: 14px; line-height: 1.9; color: white;
  }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .dot1 { background: #ff5555; }
  .dot2 { background: #55ff88; }
  .dot3 { background: #ffcc44; }
</style>
</head>
<body>

<div id="info">
  <strong>G3 三锥合一柱拼合器</strong><br>
  三棱柱体积 = <span class="big">V柱</span><br>
  三个三棱锥（等底等高，体积相等）<br>
  体积关系：<span class="big">V锥 = V柱 ÷ 3</span><br>
  分离程度：<span id="tShow" class="big">0%</span>
</div>

<div id="hint">
  💡 提示<br>
  拖动下方滑块：<br>
  0% = 三个锥合成柱<br>
  100% = 三个锥完全分开<br>
  鼠标拖动可旋转视角
</div>

<div id="legend">
  <span class="dot dot1"></span>锥体 1（A-B-C-A₁）<br>
  <span class="dot dot2"></span>锥体 2（A₁-B-B₁-C）<br>
  <span class="dot dot3"></span>锥体 3（A₁-B₁-C₁-C）
</div>

<div id="controls">
  <div id="sliderRow">
    <label>分离程度：</label>
    <input type="range" id="tSlider" min="0" max="100" value="0" step="1">
    <span id="tValue">0%</span>
  </div>
  <div id="btnRow">
    <button id="btnSeparate">自动分离</button>
    <button id="btnMerge">自动拼合</button>
    <button id="btnReset">重置视角</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   几何参数
   三棱柱 ABC-A₁B₁C₁，底面为边长 2 的等边三角形，柱高 2
   ============================================================ */
const A  = new THREE.Vector3(-1, 0, -0.577);
const B  = new THREE.Vector3( 1, 0, -0.577);
const C  = new THREE.Vector3( 0, 0,  1.155);
const A1 = new THREE.Vector3(-1, 2, -0.577);
const B1 = new THREE.Vector3( 1, 2, -0.577);
const C1 = new THREE.Vector3( 0, 2,  1.155);

/* 柱体中心（用于计算分离方向） */
const COLUMN_CENTER = new THREE.Vector3(0, 1, 0.0);

/* ============================================================
   场景
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(6, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

/* ============================================================
   光照
   ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.3);
dirLight1.position.set(6, 10, 7);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0x88aaff, 0.6);
dirLight2.position.set(-6, 4, -7);
scene.add(dirLight2);

/* ============================================================
   地面
   ============================================================ */
scene.add(new THREE.GridHelper(12, 24, 0x444466, 0x2a2a44));

/* ============================================================
   辅助函数：构造一个四面体（三棱锥）的 Mesh
   参数：v0, v1, v2, v3 四个顶点（Vector3）、color 颜色
   ============================================================ */
function makeTetrahedron(v0, v1, v2, v3, color) {
  const verts = new Float32Array([
    // 面 1: v0-v1-v2
    v0.x, v0.y, v0.z,  v1.x, v1.y, v1.z,  v2.x, v2.y, v2.z,
    // 面 2: v0-v1-v3
    v0.x, v0.y, v0.z,  v1.x, v1.y, v1.z,  v3.x, v3.y, v3.z,
    // 面 3: v0-v2-v3
    v0.x, v0.y, v0.z,  v2.x, v2.y, v2.z,  v3.x, v3.y, v3.z,
    // 面 4: v1-v2-v3
    v1.x, v1.y, v1.z,  v2.x, v2.y, v2.z,  v3.x, v3.y, v3.z,
  ]);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: color,
    transparent: true,
    opacity: 0.72,
    side: THREE.DoubleSide,
    roughness: 0.4,
    metalness: 0.05,
    emissive: color,
    emissiveIntensity: 0.12,
  });

  const mesh = new THREE.Mesh(geo, mat);

  // 记录质心，用于计算分离方向
  const cx = (v0.x + v1.x + v2.x + v3.x) / 4;
  const cy = (v0.y + v1.y + v2.y + v3.y) / 4;
  const cz = (v0.z + v1.z + v2.z + v3.z) / 4;
  mesh.userData.centroid = new THREE.Vector3(cx, cy, cz);

  // 计算分离方向（从柱体中心指向锥体质心）
  const dir = mesh.userData.centroid.clone().sub(COLUMN_CENTER);
  if (dir.length() < 0.01) dir.set(0, 1, 0);
  mesh.userData.direction = dir.normalize();

  return mesh;
}

/* ============================================================
   三个四面体
   T1 = A-B-C-A₁（底面 ABC 的锥体）
   T2 = A₁-B-B₁-C（侧面 BCC₁B₁ 拆出的锥体）
   T3 = A₁-B₁-C₁-C（顶面 A₁B₁C₁ 的锥体）
   ============================================================ */
const tetra1 = makeTetrahedron(A,  B,  C,  A1, 0xff5555);
const tetra2 = makeTetrahedron(A1, B,  B1, C,  0x55ff88);
const tetra3 = makeTetrahedron(A1, B1, C1, C,  0xffcc44);

scene.add(tetra1);
scene.add(tetra2);
scene.add(tetra3);

/* ============================================================
   三棱柱的外框（线框），作为参照
   显示理想柱体的形状，方便学生对比
   ============================================================ */
const prismOutlineGeo = new THREE.BufferGeometry();
const outlinePoints = [
  // 底面
  A.x, A.y, A.z,  B.x, B.y, B.z,
  B.x, B.y, B.z,  C.x, C.y, C.z,
  C.x, C.y, C.z,  A.x, A.y, A.z,
  // 顶面
  A1.x, A1.y, A1.z,  B1.x, B1.y, B1.z,
  B1.x, B1.y, B1.z,  C1.x, C1.y, C1.z,
  C1.x, C1.y, C1.z,  A1.x, A1.y, A1.z,
  // 侧棱
  A.x, A.y, A.z,  A1.x, A1.y, A1.z,
  B.x, B.y, B.z,  B1.x, B1.y, B1.z,
  C.x, C.y, C.z,  C1.x, C1.y, C1.z,
];
prismOutlineGeo.setAttribute('position', new THREE.Float32BufferAttribute(outlinePoints, 3));
const prismOutline = new THREE.LineSegments(
  prismOutlineGeo,
  new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4 })
);
scene.add(prismOutline);

/* ============================================================
   分离/拼合逻辑
   t ∈ [0, 1]，0 = 完全拼合，1 = 完全分离
   ============================================================ */
let targetT = 0;       // 目标分离程度
let currentT = 0;      // 当前显示值（用于平滑动画）
const MAX_SEPARATION = 3.5; // 最大分离距离

function applySeparation(t) {
  // t 从 0 到 1 映射到分离距离 0 到 MAX_SEPARATION
  const dist = t * MAX_SEPARATION;

  [tetra1, tetra2, tetra3].forEach((tetra) => {
    const off = tetra.userData.direction.clone().multiplyScalar(dist);
    tetra.position.copy(off);
  });
}

/* ============================================================
   UI 绑定
   ============================================================ */
const tSlider = document.getElementById('tSlider');
const tValue = document.getElementById('tValue');
const tShow = document.getElementById('tShow');

tSlider.addEventListener('input', (e) => {
  targetT = parseInt(e.target.value) / 100;
  tValue.textContent = Math.round(targetT * 100) + '%';
  tShow.textContent = Math.round(targetT * 100) + '%';
});

document.getElementById('btnSeparate').onclick = () => {
  targetT = 1;
  tSlider.value = 100;
  tValue.textContent = '100%';
  tShow.textContent = '100%';
};

document.getElementById('btnMerge').onclick = () => {
  targetT = 0;
  tSlider.value = 0;
  tValue.textContent = '0%';
  tShow.textContent = '0%';
};

document.getElementById('btnReset').onclick = () => {
  camera.position.set(6, 5, 8);
  controls.target.set(0, 1, 0);
  controls.update();
};

/* ============================================================
   动画循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  // 平滑过渡
  currentT += (targetT - currentT) * 0.08;
  applySeparation(currentT);

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   窗口自适应
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
