<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>G6 球体积薄片逼近器</title>
<style>
  body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #info {
    position: absolute; top: 20px; left: 20px;
    color: white; background: rgba(0,0,0,0.75);
    padding: 15px 20px; border-radius: 8px;
    font-size: 15px; line-height: 1.9;
  }
  #info strong { color: #66ccff; font-size: 17px; }
  .val { color: #ffcc00; font-weight: bold; }
  .err { color: #ff6666; font-weight: bold; }
  #controls {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 18px 28px; border-radius: 10px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; min-width: 500px;
  }
  #sliderRow { display: flex; align-items: center; gap: 15px; width: 100%; }
  #sliderRow label { color: white; font-size: 16px; }
  input[type=range] { flex: 1; height: 8px; cursor: pointer; }
  #nValue { color: #ffcc00; font-weight: bold; font-size: 20px; min-width: 50px; text-align: right; }
  #btnRow { display: flex; gap: 12px; }
  button {
    padding: 10px 22px; font-size: 15px;
    border: none; border-radius: 6px;
    cursor: pointer; background: #4488ff;
    color: white; font-weight: bold;
  }
  button:hover { background: #3366cc; }
  #recordBtn { background: #22aa66; }
  #recordBtn:hover { background: #118855; }
  #hint {
    position: absolute; top: 20px; right: 20px;
    color: #aaccff; background: rgba(0,0,0,0.7);
    padding: 12px 18px; border-radius: 8px;
    font-size: 14px; line-height: 1.7; max-width: 260px;
  }
</style>
</head>
<body>

<div id="info">
  <strong>G6 球体积薄片逼近器</strong><br>
  层数 n = <span class="val" id="nShow">10</span><br>
  近似体积 = <span class="val" id="vApprox">0</span><br>
  精确体积 = <span class="val" id="vExact">16.7552</span><br>
  相对误差 = <span class="err" id="vError">0%</span>
</div>

<div id="hint">
  💡 提示<br>
  拖动下方滑块改变层数 n<br>
  鼠标拖动可旋转视角<br>
  滚轮可放大缩小
</div>

<div id="controls">
  <div id="sliderRow">
    <label>薄片数 n：</label>
    <input type="range" id="nSlider" min="1" max="200" value="10" step="1">
    <span id="nValue">10</span>
  </div>
  <div id="btnRow">
    <button id="recordBtn">📋 记录当前数据</button>
    <button id="resetBtn">重置视角</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 数学参数 ================= */
const R = 2;                                       // 半球半径
const V_EXACT = (2/3) * Math.PI * R * R * R;       // 半球精确体积
const MAX_N = 200;                                 // 最大薄片数

/* ================= 场景 ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(5, 4, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

/* ================= 光照 ================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0x88aaff, 0.5);
dirLight2.position.set(-5, 3, -7);
scene.add(dirLight2);

/* ================= 地面网格 ================= */
scene.add(new THREE.GridHelper(10, 20, 0x444466, 0x2a2a44));

/* ================= 半球的线框轮廓（作为参照） ================= */
const outlineGeo = new THREE.SphereGeometry(R, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
const outlineMat = new THREE.MeshBasicMaterial({
  color: 0x66ccff,
  wireframe: true,
  transparent: true,
  opacity: 0.15
});
const outline = new THREE.Mesh(outlineGeo, outlineMat);
scene.add(outline);

/* 底面圆环（赤道） */
const ringGeo = new THREE.RingGeometry(R - 0.03, R + 0.03, 64);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x66ccff, side: THREE.DoubleSide, transparent: true, opacity: 0.6
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
scene.add(ring);

/* ================= 薄片集合（InstancedMesh） ================= */
const sliceGeo = new THREE.CylinderGeometry(1, 1, 1, 32);
const sliceMat = new THREE.MeshStandardMaterial({
  color: 0x4488ff,
  roughness: 0.5,
  metalness: 0.1,
  emissive: 0x113366,
  emissiveIntensity: 0.4
});

const slices = new THREE.InstancedMesh(sliceGeo, sliceMat, MAX_N);
slices.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(slices);

/* ================= 更新薄片 ================= */
function updateSlices(n) {
  const dh = R / n;
  let approxVol = 0;

  for (let i = 0; i < n; i++) {
    const yMid = (i + 0.5) * dh;
    const r = Math.sqrt(Math.max(0, R * R - yMid * yMid));

    const matrix = new THREE.Matrix4();
    matrix.compose(
      new THREE.Vector3(0, yMid, 0),
      new THREE.Quaternion(),
      new THREE.Vector3(r, dh, r)
    );
    slices.setMatrixAt(i, matrix);

    approxVol += Math.PI * r * r * dh;
  }

  slices.count = n;
  slices.instanceMatrix.needsUpdate = true;

  return approxVol;
}

/* ================= UI 更新 ================= */
const nSlider = document.getElementById('nSlider');
const nValue = document.getElementById('nValue');
const nShow = document.getElementById('nShow');
const vApprox = document.getElementById('vApprox');
const vExact = document.getElementById('vExact');
const vError = document.getElementById('vError');

vExact.textContent = V_EXACT.toFixed(4);

function refresh(n) {
  const approx = updateSlices(n);
  const relErr = Math.abs(approx - V_EXACT) / V_EXACT * 100;

  nValue.textContent = n;
  nShow.textContent = n;
  vApprox.textContent = approx.toFixed(4);
  vError.textContent = relErr.toFixed(2) + '%';

  return { approx, relErr };
}

nSlider.addEventListener('input', (e) => {
  const n = parseInt(e.target.value);
  refresh(n);

  /* ============ 智能体触发逻辑 ============ */
  if (n > 100 && !window.agentTriggered) {
    window.agentTriggered = true;
    const approx = updateSlices(n);
    const relErr = Math.abs(approx - V_EXACT) / V_EXACT * 100;

    /* 把这句话发给智能体 A1 的输入框 */
    const agentPrompt =
      `学生已将薄片数调至 ${n}，误差 ${relErr.toFixed(2)}%。` +
      `请追问：误差会变成 0 吗？"变成 0"与"可以任意小"是一回事吗？`;

    /* 复制到剪贴板，方便学生直接粘贴给智能体 */
    copyToClipboard(agentPrompt);
    showToast('已触发智能体追问，内容已复制，请粘贴给 A1');
  }
});

/* 重置触发器，避免反复触发 */
nSlider.addEventListener('change', (e) => {
  const n = parseInt(e.target.value);
  if (n <= 100) {
    window.agentTriggered = false;
  }
});

/* ================= 记录数据按钮 ================= */
document.getElementById('recordBtn').onclick = () => {
  const n = parseInt(nSlider.value);
  const approx = updateSlices(n);
  const relErr = Math.abs(approx - V_EXACT) / V_EXACT * 100;

  const report =
`【G6 球体积薄片逼近器 数据记录】
层数 n = ${n}
近似体积 = ${approx.toFixed(4)}
精确体积 = ${V_EXACT.toFixed(4)}
相对误差 = ${relErr.toFixed(2)}%
时间 = ${new Date().toLocaleString('zh-CN')}`;

  copyToClipboard(report);
  showToast('数据已复制，可粘贴给智能体或填入学案');
};

/* ================= 重置视角 ================= */
document.getElementById('resetBtn').onclick = () => {
  camera.position.set(5, 4, 7);
  controls.target.set(0, 1, 0);
  controls.update();
};

/* ================= 工具函数 ================= */
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = 0;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

/* 简易提示条 */
let toastEl = null;
function showToast(msg) {
  if (toastEl) toastEl.remove();
  toastEl = document.createElement('div');
  toastEl.textContent = msg;
  toastEl.style.cssText = `
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(34,170,102,0.95); color: white;
    padding: 14px 26px; border-radius: 8px; font-size: 16px;
    z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: opacity 0.4s;
  `;
  document.body.appendChild(toastEl);
  setTimeout(() => {
    if (toastEl) {
      toastEl.style.opacity = '0';
      setTimeout(() => { if (toastEl) toastEl.remove(); toastEl = null; }, 400);
    }
  }, 2200);
}

/* ================= 初始化 ================= */
refresh(10);

/* ================= 动画循环 ================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ================= 窗口自适应 ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
