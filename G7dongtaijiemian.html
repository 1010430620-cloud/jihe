<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>G7 动态截面切割器</title>
<style>
  body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; background: #1a1a2e; color: white; }

  #title {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 19px; color: #66ccff;
    background: rgba(0,0,0,0.72);
    padding: 8px 24px; border-radius: 20px;
    font-weight: bold; letter-spacing: 2px;
  }

  #info {
    position: absolute; top: 80px; left: 20px;
    background: rgba(0,0,0,0.78);
    padding: 14px 20px; border-radius: 10px;
    font-size: 14px; line-height: 1.9; min-width: 250px;
  }
  #info h3 { margin: 0 0 8px; color: #66ccff; font-size: 15px; }
  .row-info { display: flex; justify-content: space-between; gap: 16px; }
  .val { color: #88ffbb; font-weight: bold; }
  .big { color: #ffcc00; font-weight: bold; font-size: 16px; }
  .type { color: #ff8866; font-weight: bold; font-size: 16px; }

  #hint {
    position: absolute; top: 80px; right: 20px;
    background: rgba(0,0,0,0.7); padding: 12px 18px; border-radius: 8px;
    font-size: 13px; line-height: 1.8; max-width: 240px; color: #aaccff;
  }
  #hint strong { color: #ffcc00; }

  #legend {
    position: absolute; bottom: 210px; right: 20px;
    background: rgba(0,0,0,0.72);
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px; line-height: 1.85;
  }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }

  #controls {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); padding: 16px 24px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px; min-width: 720px;
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 14px; color: #ccc; white-space: nowrap; }
  .row select {
    padding: 6px 12px; background: #1a1a2e; color: #88ccff;
    border: 1px solid #4488ff; border-radius: 6px;
    font-size: 14px; font-weight: bold; font-family: inherit;
  }
  .row input[type=range] { flex: 1; min-width: 120px; height: 6px; cursor: pointer; }
  .row .value { color: #ffcc00; font-weight: bold; font-size: 15px; min-width: 60px; text-align: right; }

  #btnRow button {
    padding: 8px 18px; font-size: 13px;
    border: none; border-radius: 6px; cursor: pointer;
    background: #4488ff; color: white; font-weight: bold; font-family: inherit;
  }
  #btnRow button:hover { background: #3366cc; }
  #btnRow button.active { background: #22aa66; }
</style>
</head>
<body>

<div id="title">G7 动态截面切割器</div>

<div id="info">
  <h3>截面信息</h3>
  <div class="row-info"><span>图形</span><span class="val" id="infoShape">球体</span></div>
  <div class="row-info"><span>平面倾角</span><span class="val" id="infoAngle">0°</span></div>
  <div class="row-info"><span>平面高度</span><span class="val" id="infoH">1.50</span></div>
  <div class="row-info"><span>截面类型</span><span class="type" id="infoType">圆</span></div>
  <div class="row-info"><span>截面面积</span><span class="big" id="infoArea">0.0000</span></div>
  <div class="row-info"><span>截面周长</span><span class="val" id="infoPerimeter">0.0000</span></div>
</div>

<div id="hint">
  💡 <strong>玩法</strong><br>
  1. 选图形<br>
  2. 拖倾角滑块：<br>
  　 0° = 水平截<br>
  　 90° = 垂直截<br>
  3. 拖高度滑块移动平面<br>
  4. 鼠标拖动旋转视角<br><br>
  观察：<strong>球体无论怎么斜切，截面永远是圆！</strong>
</div>

<div id="legend">
  <div><span class="dot" style="background:#66ccff"></span>立体表面</div>
  <div><span class="dot" style="background:#ffffff;opacity:0.4"></span>切割平面</div>
  <div><span class="dot" style="background:#ffcc00"></span>截面</div>
</div>

<div id="controls">
  <div class="row">
    <label>图形</label>
    <select id="shapeSelect">
      <option value="sphere">球体</option>
      <option value="cylinder">圆柱</option>
      <option value="cone">圆锥</option>
      <option value="frustum">圆台</option>
    </select>
    <label>倾角</label>
    <input type="range" id="angleSlider" min="0" max="90" value="0" step="1">
    <span class="value" id="angleValue">0°</span>
    <label>高度</label>
    <input type="range" id="hSlider" min="0" max="100" value="50" step="1">
    <span class="value" id="hValue">1.50</span>
  </div>
  <div class="row" id="btnRow" style="justify-content:center;">
    <button id="btnH">水平截面</button>
    <button id="btn45">45° 斜截</button>
    <button id="btnV">垂直截面</button>
    <button id="btnReset">重置视角</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ 形状配置 ============ */
const SHAPES = {
  sphere: {
    name: '球体',
    create: () => {
      const g = new THREE.SphereGeometry(1.2, 64, 48);
      g.translate(0, 1.5, 0);
      return g;
    },
    yMin: 0.3, yMax: 2.7, yInit: 1.5,
  },
  cylinder: {
    name: '圆柱',
    create: () => {
      const g = new THREE.CylinderGeometry(1.2, 1.2, 2.5, 64, 8, false);
      g.translate(0, 1.25, 0);
      return g;
    },
    yMin: 0.05, yMax: 2.45, yInit: 1.25,
  },
  cone: {
    name: '圆锥',
    create: () => {
      const g = new THREE.ConeGeometry(1.2, 2.5, 64, 8, false);
      g.translate(0, 1.25, 0);
      return g;
    },
    yMin: 0.05, yMax: 2.45, yInit: 1.25,
  },
  frustum: {
    name: '圆台',
    create: () => {
      const g = new THREE.CylinderGeometry(0.5, 1.2, 2.5, 64, 8, false);
      g.translate(0, 1.25, 0);
      return g;
    },
    yMin: 0.05, yMax: 2.45, yInit: 1.25,
  },
};

let shapeType = 'sphere';
let angleDeg = 0;
let planeY = 1.5;
let shapeGeo = null;

/* ============ 场景 ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(4.5, 4, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.25, 0);

/* ============ 光照 ============ */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dl1 = new THREE.DirectionalLight(0xffffff, 1.1);
dl1.position.set(5, 10, 7); scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.6);
dl2.position.set(-5, 4, -7); scene.add(dl2);
const dl3 = new THREE.DirectionalLight(0xffffff, 0.5);
dl3.position.set(0, -5, 0); scene.add(dl3);

/* ============ 地面网格 ============ */
const grid = new THREE.GridHelper(12, 24, 0x444466, 0x2a2a44);
scene.add(grid);

/* ============ 立体表面 ============ */
const shapeMat = new THREE.MeshStandardMaterial({
  color: 0x66ccff, side: THREE.DoubleSide,
  transparent: true, opacity: 0.3,
  roughness: 0.5, metalness: 0.1,
  emissive: 0x113355, emissiveIntensity: 0.2,
  depthWrite: false,
});
const shapeMesh = new THREE.Mesh(new THREE.BufferGeometry(), shapeMat);
shapeMesh.frustumCulled = false;
scene.add(shapeMesh);

/* 立体边缘线（提高辨识度） */
const shapeEdgeMat = new THREE.LineBasicMaterial({
  color: 0x88ddff, transparent: true, opacity: 0.35,
});
const shapeEdge = new THREE.LineSegments(new THREE.BufferGeometry(), shapeEdgeMat);
shapeEdge.frustumCulled = false;
scene.add(shapeEdge);

/* ============ 切割平面可视化 ============ */
const planeMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, side: THREE.DoubleSide,
  transparent: true, opacity: 0.08,
  depthWrite: false,
});
const planeMesh = new THREE.Mesh(new THREE.BufferGeometry(), planeMat);
planeMesh.frustumCulled = false;
scene.add(planeMesh);

/* 平面边框 */
const planeEdgeMat = new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.3,
});
const planeEdge = new THREE.LineSegments(new THREE.BufferGeometry(), planeEdgeMat);
planeEdge.frustumCulled = false;
scene.add(planeEdge);

/* ============ 截面填充 ============ */
const sliceMat = new THREE.MeshBasicMaterial({
  color: 0xffcc00, side: THREE.DoubleSide,
  transparent: true, opacity: 0.68,
  depthWrite: false,
});
const sliceMesh = new THREE.Mesh(new THREE.BufferGeometry(), sliceMat);
sliceMesh.frustumCulled = false;
sliceMesh.renderOrder = 10;
scene.add(sliceMesh);

/* 截面轮廓 */
const sliceLineMat = new THREE.LineBasicMaterial({
  color: 0xffee66, linewidth: 2,
});
const sliceLine = new THREE.LineSegments(new THREE.BufferGeometry(), sliceLineMat);
sliceLine.frustumCulled = false;
sliceLine.renderOrder = 11;
scene.add(sliceLine);

/* ============ 平面法向量 ============ */
function getPlaneNormal() {
  const a = angleDeg * Math.PI / 180;
  return new THREE.Vector3(Math.sin(a), Math.cos(a), 0);
}
function getPlanePoint() {
  return new THREE.Vector3(0, planeY, 0);
}

/* ============ 计算截面：遍历三角形，找出与平面相交的边 ============ */
function computeSlice(geometry, P, n) {
  if (!geometry.index) return [];
  const pos = geometry.attributes.position.array;
  const idx = geometry.index.array;
  const triCount = idx.length / 3;

  const dist = (vi) => {
    const px = pos[vi*3]     - P.x;
    const py = pos[vi*3 + 1] - P.y;
    const pz = pos[vi*3 + 2] - P.z;
    return px * n.x + py * n.y + pz * n.z;
  };

  const seen = new Set();
  const points = [];
  const EPS = 1e-9;

  const pushPoint = (ax, ay, az, bx, by, bz, da, db) => {
    const t = da / (da - db);
    const x = ax + t * (bx - ax);
    const y = ay + t * (by - ay);
    const z = az + t * (bz - az);
    /* 网格去重（1e-3 精度） */
    const key = Math.round(x*1000) + ',' + Math.round(y*1000) + ',' + Math.round(z*1000);
    if (!seen.has(key)) {
      seen.add(key);
      points.push(new THREE.Vector3(x, y, z));
    }
  };

  for (let t = 0; t < triCount; t++) {
    const i0 = idx[t*3], i1 = idx[t*3+1], i2 = idx[t*3+2];
    const d0 = dist(i0), d1 = dist(i1), d2 = dist(i2);

    const x0 = pos[i0*3],   y0 = pos[i0*3+1], z0 = pos[i0*3+2];
    const x1 = pos[i1*3],   y1 = pos[i1*3+1], z1 = pos[i1*3+2];
    const x2 = pos[i2*3],   y2 = pos[i2*3+1], z2 = pos[i2*3+2];

    if ((d0 > EPS && d1 < -EPS) || (d0 < -EPS && d1 > EPS))
      pushPoint(x0, y0, z0, x1, y1, z1, d0, d1);
    if ((d1 > EPS && d2 < -EPS) || (d1 < -EPS && d2 > EPS))
      pushPoint(x1, y1, z1, x2, y2, z2, d1, d2);
    if ((d2 > EPS && d0 < -EPS) || (d2 < -EPS && d0 > EPS))
      pushPoint(x2, y2, z2, x0, y0, z0, d2, d0);
  }

  return points;
}

/* ============ 把交点排序成多边形 ============ */
function buildPolygon(points, P, n) {
  if (points.length < 3) return null;

  /* 平面基向量 */
  const tmp = new THREE.Vector3(0, 0, 1);
  if (Math.abs(n.z) > 0.9) tmp.set(1, 0, 0);
  const u = new THREE.Vector3().crossVectors(n, tmp).normalize();
  const v = new THREE.Vector3().crossVectors(n, u).normalize();

  /* 质心 */
  const centroid = new THREE.Vector3();
  for (const p of points) centroid.add(p);
  centroid.divideScalar(points.length);

  /* 投影到 2D 并按角度排序 */
  const projected = points.map(p => {
    const rel = p.clone().sub(centroid);
    return { p, u: rel.dot(u), v: rel.dot(v) };
  });
  projected.sort((a, b) => Math.atan2(a.v, a.u) - Math.atan2(b.v, b.u));

  /* 面积（鞋带公式） */
  let area2 = 0;
  for (let i = 0; i < projected.length; i++) {
    const j = (i + 1) % projected.length;
    area2 += projected[i].u * projected[j].v - projected[j].u * projected[i].v;
  }
  const area = Math.abs(area2) / 2;

  /* 周长 */
  let perimeter = 0;
  for (let i = 0; i < projected.length; i++) {
    const j = (i + 1) % projected.length;
    perimeter += projected[i].p.distanceTo(projected[j].p);
  }

  return {
    points: projected.map(x => x.p),
    area, perimeter,
    centroid,
  };
}

/* ============ 渲染截面 ============ */
function renderSlice(slice) {
  if (!slice || slice.points.length < 3) {
    sliceMesh.visible = false;
    sliceLine.visible = false;
    return;
  }

  /* 填充：以质心为中心的三角形扇形 */
  const verts = [];
  const c = slice.centroid;
  for (let i = 0; i < slice.points.length; i++) {
    const j = (i + 1) % slice.points.length;
    const a = slice.points[i], b = slice.points[j];
    verts.push(c.x, c.y, c.z);
    verts.push(a.x, a.y, a.z);
    verts.push(b.x, b.y, b.z);
  }
  const fillGeo = new THREE.BufferGeometry();
  fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  fillGeo.computeVertexNormals();
  sliceMesh.geometry.dispose();
  sliceMesh.geometry = fillGeo;
  sliceMesh.visible = true;

  /* 轮廓 */
  const lines = [];
  for (let i = 0; i < slice.points.length; i++) {
    const j = (i + 1) % slice.points.length;
    const a = slice.points[i], b = slice.points[j];
    lines.push(a.x, a.y, a.z);
    lines.push(b.x, b.y, b.z);
  }
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
  sliceLine.geometry.dispose();
  sliceLine.geometry = lineGeo;
  sliceLine.visible = true;
}

/* ============ 平面可视化 ============ */
function renderPlane(P, n) {
  const tmp = new THREE.Vector3(0, 0, 1);
  if (Math.abs(n.z) > 0.9) tmp.set(1, 0, 0);
  const u = new THREE.Vector3().crossVectors(n, tmp).normalize();
  const v = new THREE.Vector3().crossVectors(n, u).normalize();

  const size = 2.6;
  const p0 = P.clone().addScaledVector(u, -size).addScaledVector(v, -size);
  const p1 = P.clone().addScaledVector(u,  size).addScaledVector(v, -size);
  const p2 = P.clone().addScaledVector(u,  size).addScaledVector(v,  size);
  const p3 = P.clone().addScaledVector(u, -size).addScaledVector(v,  size);

  const verts = [
    p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z,
    p0.x, p0.y, p0.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
  ];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  planeMesh.geometry.dispose();
  planeMesh.geometry = geo;

  /* 边框 */
  const edgeVerts = [
    p0.x, p0.y, p0.z, p1.x, p1.y, p1.z,
    p1.x, p1.y, p1.z, p2.x, p2.y, p2.z,
    p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
    p3.x, p3.y, p3.z, p0.x, p0.y, p0.z,
  ];
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgeVerts, 3));
  planeEdge.geometry.dispose();
  planeEdge.geometry = edgeGeo;
}

/* ============ 检测截面类型 ============ */
function detectType() {
  const a = angleDeg * Math.PI / 180;
  const horizontal = a < 0.05;
  const vertical = a > Math.PI / 2 - 0.05;
  const tilted = !horizontal && !vertical;

  if (shapeType === 'sphere') return '圆';
  if (shapeType === 'cylinder') {
    if (horizontal) return '圆';
    if (vertical) return '矩形（或矩形的一部分）';
    return '椭圆（或椭圆的一部分）';
  }
  if (shapeType === 'cone') {
    if (horizontal) return '圆';
    if (vertical) return '三角形（或双曲线）';
    return '椭圆 / 抛物线 / 双曲线';
  }
  if (shapeType === 'frustum') {
    if (horizontal) return '圆';
    if (vertical) return '梯形（或双曲线）';
    return '椭圆 / 双曲线';
  }
  return '—';
}

/* ============ 重建形状 ============ */
function rebuildShape() {
  const config = SHAPES[shapeType];
  shapeGeo = config.create();

  /* 表面 */
  shapeMesh.geometry.dispose();
  shapeMesh.geometry = shapeGeo;

  /* 边缘线（用 EdgesGeometry 提取特征边） */
  const edges = new THREE.EdgesGeometry(shapeGeo, 20);
  shapeEdge.geometry.dispose();
  shapeEdge.geometry = edges;

  /* 重置高度到形状中心 */
  planeY = config.yInit;
  document.getElementById('hSlider').value = 50;
  document.getElementById('hValue').textContent = planeY.toFixed(2);
  document.getElementById('infoShape').textContent = config.name;

  /* 更新滑块范围 */
  document.getElementById('infoH').textContent = planeY.toFixed(2);

  updateAll();
}

/* ============ 更新全部 ============ */
function updateAll() {
  const P = getPlanePoint();
  const n = getPlaneNormal();

  /* 平面可视化 */
  renderPlane(P, n);

  /* 截面计算 */
  const rawPoints = computeSlice(shapeGeo, P, n);
  const polygon = buildPolygon(rawPoints, P, n);

  /* 渲染 */
  renderSlice(polygon);

  /* 数据面板 */
  document.getElementById('infoAngle').textContent = angleDeg + '°';
  document.getElementById('infoH').textContent = planeY.toFixed(2);

  if (polygon) {
    document.getElementById('infoArea').textContent = polygon.area.toFixed(4);
    document.getElementById('infoPerimeter').textContent = polygon.perimeter.toFixed(4);
  } else {
    document.getElementById('infoArea').textContent = '—';
    document.getElementById('infoPerimeter').textContent = '—';
  }

  document.getElementById('infoType').textContent = detectType();
}

/* ============ UI 事件 ============ */
const shapeSelect = document.getElementById('shapeSelect');
const angleSlider = document.getElementById('angleSlider');
const hSlider = document.getElementById('hSlider');
const angleValue = document.getElementById('angleValue');
const hValue = document.getElementById('hValue');

shapeSelect.addEventListener('change', () => {
  shapeType = shapeSelect.value;
  rebuildShape();
});

angleSlider.addEventListener('input', () => {
  angleDeg = parseFloat(angleSlider.value);
  angleValue.textContent = angleDeg + '°';
  updateAll();
});

hSlider.addEventListener('input', () => {
  const config = SHAPES[shapeType];
  const t = parseFloat(hSlider.value) / 100;
  planeY = config.yMin + t * (config.yMax - config.yMin);
  hValue.textContent = planeY.toFixed(2);
  updateAll();
});

document.getElementById('btnH').onclick = () => {
  angleDeg = 0; angleSlider.value = 0; angleValue.textContent = '0°';
  updateAll();
};
document.getElementById('btn45').onclick = () => {
  angleDeg = 45; angleSlider.value = 45; angleValue.textContent = '45°';
  updateAll();
};
document.getElementById('btnV').onclick = () => {
  angleDeg = 90; angleSlider.value = 90; angleValue.textContent = '90°';
  updateAll();
};
document.getElementById('btnReset').onclick = () => {
  camera.position.set(4.5, 4, 5.5);
  controls.target.set(0, 1.25, 0);
  controls.update();
};

/* ============ 动画循环 ============ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

/* ============ 初始化 ============ */
rebuildShape();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
